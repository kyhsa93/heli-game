<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>헬기 조종</title>
<style>
html,body{margin:0;height:100%;background:#0b1320;overflow:hidden;font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#e8eef7;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,12,22,.74);text-align:center;padding:16px;box-sizing:border-box;z-index:5}
#overlay.hidden{display:none}
.card{max-width:440px;width:100%}
h1{margin:0 0 6px;font-size:36px;letter-spacing:.02em}
.sub{margin:0 0 18px;color:#aebbd0;font-size:15px;line-height:1.5}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;text-align:left;font-size:14px;margin:0 auto 16px;max-width:340px}
.keys b{color:#ffd166;font-weight:600;white-space:nowrap}
.rules{font-size:13px;color:#9fb0c8;line-height:1.6;margin:0 0 20px;text-align:left;padding-left:18px}
.big{font-size:44px;font-weight:700;margin:4px 0 2px;color:#ffd166}
button.go{font:inherit;font-size:18px;font-weight:600;padding:12px 34px;border-radius:12px;border:0;background:#ffd166;color:#1a1a1a;cursor:pointer}
#touch{position:fixed;inset:0;pointer-events:none;display:none;z-index:4}
#touch.on{display:block}
.btn{position:absolute;width:70px;height:70px;border-radius:50%;background:rgba(255,255,255,.13);border:2px solid rgba(255,255,255,.34);pointer-events:auto;display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;box-sizing:border-box;touch-action:none}
.btn.on{background:rgba(255,209,102,.45);border-color:#ffd166}
#bl{left:16px;bottom:calc(20px + env(safe-area-inset-bottom))}
#br{left:100px;bottom:calc(20px + env(safe-area-inset-bottom))}
#bu{right:16px;bottom:calc(100px + env(safe-area-inset-bottom));width:84px;height:84px}
#bd{right:16px;bottom:calc(20px + env(safe-area-inset-bottom));height:62px;width:84px;border-radius:31px}
#bh{right:112px;bottom:calc(28px + env(safe-area-inset-bottom));width:62px;height:62px;font-size:15px;font-weight:600}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="touch">
  <div class="btn" id="bl" data-k="left">◀</div>
  <div class="btn" id="br" data-k="right">▶</div>
  <div class="btn" id="bu" data-k="up">▲</div>
  <div class="btn" id="bd" data-k="down">▼</div>
  <div class="btn" id="bh" data-k="hook">고리</div>
</div>
<div id="overlay"><div class="card" id="card"></div></div>
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR | 0; cv.height = H * DPR | 0;
}
addEventListener('resize', resize); resize();

const G = 300, WORLD = 8000, CEIL = -450, ROPE = 90, PAD_W = 150;
const SKID = 18, CR = 11, MH = 1, MC = 0.45, K = 900, C = 34;
const LAND_VY = 130, LAND_VX = 70, LAND_A = 0.3, BREAK_VY = 300;
const STEP = 1 / 120;

function rng(seed) { return () => (seed = (seed * 1664525 + 1013904223) >>> 0) / 4294967296; }
const smooth = t => t * t * (3 - 2 * t);
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

let ground, pads, miniPath;
function buildWorld(seed) {
  const r = rng(seed);
  const ph = Array.from({ length: 6 }, () => r() * Math.PI * 2);
  const n = WORLD / 4 + 1;
  ground = new Float32Array(n);
  for (let i = 0; i < n; i++) {
    const x = i * 4;
    let h = 880 - 210 * Math.sin(x / 820 + ph[0]) - 110 * Math.sin(x / 310 + ph[1])
      - 45 * Math.sin(x / 120 + ph[2]) - 16 * Math.sin(x / 47 + ph[3]);
    h -= Math.max(0, Math.sin(x / 1500 + ph[4])) ** 6 * 380;
    ground[i] = h;
  }
  pads = [];
  const names = 'HABCDFGJ';
  let px = 420;
  for (let k = 0; k < names.length && px < WORLD - 300; k++) {
    pads.push({ x: px, name: names[k], base: k === 0 });
    px += 850 + r() * 450;
  }
  for (const p of pads) {
    const i0 = Math.round(p.x / 4);
    let sum = 0, cnt = 0;
    for (let i = i0 - 19; i <= i0 + 19; i++) { sum += ground[i]; cnt++; }
    p.y = sum / cnt;
    const half = PAD_W / 2 + 10;
    for (let i = 0; i < n; i++) {
      const d = Math.abs(i * 4 - p.x);
      if (d < half + 180) {
        const t = d <= half ? 1 : 1 - smooth((d - half) / 180);
        ground[i] = ground[i] * (1 - t) + p.y * t;
      }
    }
  }
  miniPath = [];
  for (let x = 0; x <= WORLD; x += 40) miniPath.push(groundAt(x));
}
function groundAt(x) {
  const f = clamp(x, 0, WORLD) / 4, i = Math.min(f | 0, ground.length - 2), t = f - i;
  return ground[i] * (1 - t) + ground[i + 1] * t;
}

const keys = { up: 0, down: 0, left: 0, right: 0 };
let hookPressed = false;
let mode = 'title', heli, crate, mission, score, delivered, best = 0, time = 0, wind = 0;
let particles = [], floaters = [], cam = { x: 0, y: 0 }, crashReason = '', overTimer = 0, missionPause = 0;
try { best = +localStorage.getItem('heli-best') || 0; } catch (e) {}

function reset() {
  buildWorld((Math.random() * 1e9) | 0);
  const b = pads[0];
  heli = { x: b.x - 20, y: b.y - SKID, vx: 0, vy: 0, a: 0, w: 0, T: 0, fuel: 100, landed: true, facing: 1, rotor: 0, alive: true };
  score = 0; delivered = 0; time = 0; particles = []; floaters = []; missionPause = 0;
  cam.x = heli.x; cam.y = heli.y;
  newMission();
}
function newMission() {
  const cands = pads.map((p, i) => i).filter(i => i !== 0 && (!mission || i !== mission.to));
  const from = cands[(Math.random() * cands.length) | 0];
  const tos = pads.map((p, i) => i).filter(i => i !== from);
  const to = tos[(Math.random() * tos.length) | 0];
  const p = pads[from];
  crate = { x: p.x + 38, y: p.y - CR, vx: 0, vy: 0, attached: false, onGround: true, dead: false };
  mission = { from, to, t0: time };
}

function lp(h, lx, ly) {
  lx *= h.facing;
  const c = Math.cos(h.a), s = Math.sin(h.a);
  return { x: h.x + lx * c - ly * s, y: h.y + lx * s + ly * c };
}
const hookPos = h => lp(h, 0, 20);

function burst(x, y, n, colors, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = Math.random() * spd;
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - spd * 0.3, life: life * (0.5 + Math.random()), max: life, c: colors[(Math.random() * colors.length) | 0], s: 2 + Math.random() * 4, g: 1 });
  }
}
function floatText(x, y, text, color) { floaters.push({ x, y, text, color, life: 1.8 }); }

function crash(reason) {
  if (!heli.alive) return;
  heli.alive = false; crashReason = reason; mode = 'crashed'; overTimer = 1.4;
  burst(heli.x, heli.y, 90, ['#ffd166', '#ff7b39', '#ef476f', '#555', '#333'], 320, 1.6);
  if (crate) crate.attached = false;
  if (score > best) { best = score; try { localStorage.setItem('heli-best', best); } catch (e) {} }
}

function breakCrate() {
  crate.dead = true; crate.attached = false;
  burst(crate.x, crate.y, 30, ['#c68b3e', '#8a5a24', '#e0b36a'], 180, 1);
  score = Math.max(0, score - 50);
  floatText(crate.x, crate.y - 30, '화물 파손 −50', '#ef476f');
  missionPause = 1.6;
}

function deliver() {
  const el = time - mission.t0;
  const dist = Math.abs(pads[mission.from].x - pads[mission.to].x);
  const pts = Math.round(60 + dist / 40 + Math.max(0, 90 - el) * 2);
  score += pts; delivered++;
  floatText(crate.x, crate.y - 30, `배달 완료 +${pts}`, '#06d6a0');
  burst(crate.x, crate.y - 10, 24, ['#06d6a0', '#ffd166', '#fff'], 160, 0.9);
  crate.dead = true;
  missionPause = 1.2;
}

function step(dt) {
  time += dt;
  wind = 28 * Math.sin(time * 0.07) + 16 * Math.sin(time * 0.23 + 1);
  const h = heli;

  if (missionPause > 0) { missionPause -= dt; if (missionPause <= 0) newMission(); }

  let tension = null;
  if (h.alive) {
    if (hookPressed && crate && !crate.dead) {
      const hp = hookPos(h);
      if (crate.attached) { crate.attached = false; floatText(hp.x, hp.y + 10, '고리 해제', '#ffd166'); }
      else if (Math.hypot(hp.x - crate.x, hp.y - crate.y) < 48) { crate.attached = true; floatText(hp.x, hp.y - 40, '고리 연결', '#ffd166'); }
    }

    let target = keys.up ? 1.78 * G : keys.down ? 0.35 * G : (h.landed ? 0 : 0.97 * G);
    if (h.fuel <= 0) target = 0;
    h.T += (target - h.T) * Math.min(1, dt * 3);
    if (h.T > 0.2 * G) h.fuel = Math.max(0, h.fuel - h.T / G * 1.05 * dt);
    h.rotor += (h.T / G + (h.landed ? 0.05 : 0.3)) * dt * 40;

    const tin = (keys.right ? 1 : 0) - (keys.left ? 1 : 0);
    if (!h.landed) {
      h.w += tin * 7 * dt - h.a * (tin ? 0.8 : 3.5) * dt;
      h.w *= Math.exp(-3 * dt);
      h.a = clamp(h.a + h.w * dt, -0.75, 0.75);
      if (Math.abs(h.a) === 0.75) h.w = 0;
    } else { h.a *= Math.exp(-10 * dt); h.w = 0; }
    if (tin) h.facing = tin;
    else if (Math.abs(h.vx) > 60) h.facing = Math.sign(h.vx);

    const eff = h.y < CEIL ? Math.max(0, 1 - (CEIL - h.y) / 250) : 1;
    const T = h.T * eff;
    let ax = T * Math.sin(h.a) + (wind - h.vx) * 0.35;
    let ay = G - T * Math.cos(h.a) - h.vy * 0.5;

    if (crate && crate.attached) {
      const hp = hookPos(h), dx = crate.x - hp.x, dy = crate.y - hp.y, d = Math.hypot(dx, dy);
      if (d > ROPE) {
        const nx = dx / d, ny = dy / d;
        const vr = (crate.vx - h.vx) * nx + (crate.vy - h.vy) * ny;
        const f = Math.max(0, K * (d - ROPE) + C * vr);
        tension = { x: f * nx, y: f * ny };
        ax += tension.x / MH; ay += tension.y / MH;
      }
    }

    if (h.landed) {
      h.vx = 0; h.vy = 0;
      if (keys.up && T - G + (tension ? tension.y : 0) > 0) { h.landed = false; h.vy = -5; }
    } else {
      h.vx += ax * dt; h.vy += ay * dt;
      h.x += h.vx * dt; h.y += h.vy * dt;
      if (h.x < 60) { h.x = 60; h.vx = Math.abs(h.vx) * 0.3; }
      if (h.x > WORLD - 60) { h.x = WORLD - 60; h.vx = -Math.abs(h.vx) * 0.3; }

      const body = [lp(h, 23, 3), lp(h, -46, -6), lp(h, -46, -16), lp(h, 42, -17), lp(h, -42, -17), lp(h, 0, 12)];
      for (const p of body) if (p.y >= groundAt(p.x)) { crash(p === body[3] || p === body[4] ? '로터가 지형에 부딪혔습니다' : '기체가 지형에 충돌했습니다'); break; }
      if (h.alive) {
        const sl = lp(h, -16, SKID), sr = lp(h, 16, SKID);
        const gl = groundAt(sl.x), gr = groundAt(sr.x);
        if (sl.y >= gl || sr.y >= gr) {
          if (h.vy > LAND_VY) crash(`착륙 속도 초과 (${Math.round(h.vy)} > ${LAND_VY})`);
          else if (Math.abs(h.vx) > LAND_VX) crash('수평 속도가 너무 빠릅니다');
          else if (Math.abs(h.a) > LAND_A) crash('기울어진 채로 착륙했습니다');
          else if (Math.abs(gl - gr) > 8) crash('경사가 너무 급한 곳에 착륙했습니다');
          else {
            h.landed = true; h.y = Math.min(gl, gr) - SKID; h.vx = 0; h.vy = 0; h.w = 0;
            const pad = pads.find(p => Math.abs(p.x - h.x) < PAD_W / 2);
            if (pad && pad.base && h.fuel < 99) floatText(h.x, h.y - 40, '연료 보급 중', '#118ab2');
          }
        }
      }
    }

    if (h.landed) {
      const pad = pads.find(p => Math.abs(p.x - h.x) < PAD_W / 2);
      if (pad && pad.base) h.fuel = Math.min(100, h.fuel + 22 * dt);
    }

    const alt = groundAt(h.x) - h.y - SKID;
    if (alt < 90 && h.T > 0.6 * G && Math.random() < dt * 40 * (1 - alt / 90)) {
      const gx = h.x + (Math.random() - 0.5) * 30;
      particles.push({ x: gx, y: groundAt(gx) - 2, vx: (Math.random() < 0.5 ? -1 : 1) * (80 + Math.random() * 120), vy: -10 - Math.random() * 30, life: 0.7, max: 0.7, c: 'rgba(210,190,150,0.6)', s: 3 + Math.random() * 4, g: 0 });
    }
  }
  hookPressed = false;

  if (crate && !crate.dead) {
    let ax = (wind - crate.vx) * 0.12, ay = G - crate.vy * 0.12;
    if (tension && crate.attached) { ax -= tension.x / MC; ay -= tension.y / MC; }
    crate.vx += ax * dt; crate.vy += ay * dt;
    crate.x = clamp(crate.x + crate.vx * dt, 20, WORLD - 20);
    crate.y += crate.vy * dt;
    const gy = groundAt(crate.x) - CR;
    if (crate.y >= gy) {
      if (crate.vy > BREAK_VY) breakCrate();
      else {
        crate.y = gy;
        if (crate.vy > 0) crate.vy = 0;
        crate.vx *= Math.exp(-7 * dt);
        crate.onGround = true;
      }
    } else crate.onGround = false;

    if (!crate.dead && !crate.attached && crate.onGround && Math.abs(crate.vx) < 8 && missionPause <= 0) {
      const tp = pads[mission.to];
      if (Math.abs(crate.x - tp.x) < PAD_W / 2 - 4) deliver();
    }
  }

  for (const p of particles) { p.vy += G * p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const f of floaters) { f.y -= 30 * dt; f.life -= dt; }
  floaters = floaters.filter(f => f.life > 0);

  if (mode === 'crashed') { overTimer -= dt; if (overTimer <= 0) { mode = 'over'; showOver(); } }
}

function viewScale() { return clamp(Math.min(H / 760, W / 620), 0.5, 1.3); }

function render() {
  const s = viewScale();
  const tx = heli.alive ? heli.x + heli.vx * 0.5 : cam.x, ty = heli.alive ? heli.y + heli.vy * 0.3 - 40 : cam.y;
  cam.x += (tx - cam.x) * 0.08; cam.y += (ty - cam.y) * 0.08;
  const halfW = W / 2 / s;
  cam.x = clamp(cam.x, halfW, WORLD - halfW);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const alt01 = clamp((900 - cam.y) / 1400, 0, 1);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `hsl(212,${55 + alt01 * 15}%,${38 - alt01 * 14}%)`);
  sky.addColorStop(1, `hsl(200,55%,${74 - alt01 * 10}%)`);
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  ctx.fillStyle = 'rgba(255,255,255,0.55)';
  for (let i = 0; i < 9; i++) {
    const cxw = i * 1100 + 300, cy = 80 + (i * 97 % 260);
    const sx = ((cxw - cam.x * 0.5) % (W + 400) + W + 400) % (W + 400) - 200, sy = H * 0.5 + (cy - 300 - cam.y * 0.2 + 180) * s * 0.7;
    ctx.beginPath();
    ctx.ellipse(sx, sy, 70 * s, 18 * s, 0, 0, Math.PI * 2);
    ctx.ellipse(sx + 40 * s, sy - 10 * s, 45 * s, 16 * s, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  for (const [par, col, base, amp] of [[0.25, '#6b88a8', 0.62, 1], [0.45, '#4f6d8c', 0.72, 1.3]]) {
    ctx.fillStyle = col; ctx.beginPath(); ctx.moveTo(0, H);
    for (let sx = 0; sx <= W + 8; sx += 8) {
      const wx = cam.x * par + (sx - W / 2) / s;
      const hh = 90 * Math.sin(wx / 330) + 50 * Math.sin(wx / 140 + 2) + 30 * Math.sin(wx / 61);
      ctx.lineTo(sx, H * base - (hh * amp + 60) * s - (cam.y - 700) * s * par * 0.4);
    }
    ctx.lineTo(W, H); ctx.fill();
  }

  ctx.setTransform(DPR * s, 0, 0, DPR * s, DPR * (W / 2 - cam.x * s), DPR * (H / 2 - cam.y * s));
  const x0 = Math.max(0, cam.x - halfW - 20), x1 = Math.min(WORLD, cam.x + halfW + 20), yBot = cam.y + H / 2 / s + 20;

  const earth = ctx.createLinearGradient(0, 300, 0, 1300);
  earth.addColorStop(0, '#6c7a45'); earth.addColorStop(1, '#3a3222');
  ctx.fillStyle = earth; ctx.beginPath(); ctx.moveTo(x0, yBot);
  for (let x = x0; x <= x1; x += 6) ctx.lineTo(x, groundAt(x));
  ctx.lineTo(x1, groundAt(x1)); ctx.lineTo(x1, yBot); ctx.fill();
  ctx.strokeStyle = '#8fb35a'; ctx.lineWidth = 4; ctx.beginPath();
  for (let x = x0; x <= x1; x += 6) x === x0 ? ctx.moveTo(x, groundAt(x)) : ctx.lineTo(x, groundAt(x));
  ctx.stroke();

  for (let x = Math.floor(x0 / 90) * 90; x < x1; x += 90) {
    const hsh = Math.sin(x * 12.9898) * 43758.5453 % 1;
    if (hsh < 0.35 || pads.some(p => Math.abs(p.x - x) < PAD_W / 2 + 30)) continue;
    const gy = groundAt(x), th = 16 + hsh * 20;
    ctx.fillStyle = '#4a3a24'; ctx.fillRect(x - 2, gy - th * 0.5, 4, th * 0.5);
    ctx.fillStyle = '#3f6b35'; ctx.beginPath(); ctx.moveTo(x - th * 0.35, gy - th * 0.35); ctx.lineTo(x, gy - th * 1.2); ctx.lineTo(x + th * 0.35, gy - th * 0.35); ctx.fill();
  }

  pads.forEach((p, i) => {
    if (p.x < x0 - PAD_W || p.x > x1 + PAD_W) return;
    const isTo = mission && i === mission.to && !(crate && crate.dead), isFrom = mission && i === mission.from && crate && !crate.dead && !crate.attached;
    ctx.fillStyle = '#5b5f66'; ctx.fillRect(p.x - PAD_W / 2, p.y, PAD_W, 8);
    ctx.fillStyle = '#7d828b'; ctx.fillRect(p.x - PAD_W / 2, p.y - 1, PAD_W, 3);
    const blink = (Math.sin(time * 5 + i) > 0);
    ctx.fillStyle = isTo ? (blink ? '#06d6a0' : '#0a5') : (p.base ? '#118ab2' : '#ffd166');
    for (const sx of [-1, 1]) { ctx.beginPath(); ctx.arc(p.x + sx * (PAD_W / 2 - 4), p.y - 3, 3, 0, Math.PI * 2); ctx.fill(); }
    ctx.fillStyle = 'rgba(255,255,255,0.85)'; ctx.font = 'bold 22px system-ui,sans-serif'; ctx.textAlign = 'center';
    ctx.fillText(p.name, p.x, p.y + 30);
    if (p.base) { ctx.font = 'bold 11px system-ui,sans-serif'; ctx.fillStyle = '#9fd8ef'; ctx.fillText('FUEL', p.x, p.y + 44); }
    if (isTo) {
      ctx.fillStyle = `rgba(6,214,160,${0.12 + 0.08 * Math.sin(time * 4)})`;
      ctx.fillRect(p.x - PAD_W / 2, p.y - 260, PAD_W, 260);
      ctx.fillStyle = '#06d6a0'; ctx.font = 'bold 14px system-ui,sans-serif'; ctx.fillText('도착지', p.x, p.y - 12);
    }
    if (isFrom) { ctx.fillStyle = '#ffd166'; ctx.font = 'bold 14px system-ui,sans-serif'; ctx.fillText('화물', p.x + 38, p.y - 28); }
  });

  if (crate && !crate.dead) {
    if (crate.attached && heli.alive) {
      const hp = hookPos(heli);
      ctx.strokeStyle = '#222'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(hp.x, hp.y); ctx.lineTo(crate.x, crate.y - CR); ctx.stroke();
    }
    ctx.fillStyle = '#b77a35'; ctx.fillRect(crate.x - CR, crate.y - CR, CR * 2, CR * 2);
    ctx.strokeStyle = '#6e4519'; ctx.lineWidth = 2; ctx.strokeRect(crate.x - CR, crate.y - CR, CR * 2, CR * 2);
    ctx.beginPath(); ctx.moveTo(crate.x - CR, crate.y - CR); ctx.lineTo(crate.x + CR, crate.y + CR); ctx.moveTo(crate.x + CR, crate.y - CR); ctx.lineTo(crate.x - CR, crate.y + CR); ctx.stroke();
    if (!crate.attached && heli.alive) {
      const hp = hookPos(heli);
      if (Math.hypot(hp.x - crate.x, hp.y - crate.y) < 48) {
        ctx.strokeStyle = '#ffd166'; ctx.lineWidth = 2; ctx.setLineDash([4, 4]);
        ctx.beginPath(); ctx.arc(crate.x, crate.y, 20, 0, Math.PI * 2); ctx.stroke(); ctx.setLineDash([]);
      }
    }
  }

  if (heli.alive) drawHeli(heli);

  for (const p of particles) {
    ctx.globalAlpha = clamp(p.life / p.max, 0, 1); ctx.fillStyle = p.c;
    ctx.fillRect(p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
  }
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center'; ctx.font = 'bold 16px system-ui,sans-serif';
  for (const f of floaters) {
    ctx.globalAlpha = clamp(f.life, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText(f.text, f.x + 1, f.y + 1);
    ctx.fillStyle = f.color; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  drawHud(s);
}

function drawHeli(h) {
  ctx.save();
  ctx.translate(h.x, h.y); ctx.rotate(h.a); ctx.scale(h.facing, 1);
  const spin = clamp(h.T / G, 0, 1.2);

  ctx.strokeStyle = '#2b2f36'; ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(-9, 11); ctx.lineTo(-11, SKID); ctx.moveTo(9, 11); ctx.lineTo(11, SKID);
  ctx.moveTo(-20, SKID); ctx.lineTo(18, SKID); ctx.quadraticCurveTo(23, SKID, 24, SKID - 4);
  ctx.stroke();

  ctx.fillStyle = '#b8352c';
  ctx.beginPath(); ctx.moveTo(-10, -7); ctx.lineTo(-44, -8); ctx.lineTo(-44, -3); ctx.lineTo(-10, 4); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-40, -8); ctx.lineTo(-48, -20); ctx.lineTo(-44, -20); ctx.lineTo(-36, -8); ctx.fill();

  const tr = h.rotor * 1.7;
  ctx.fillStyle = `rgba(40,40,40,${0.15 + spin * 0.2})`;
  ctx.beginPath(); ctx.arc(-44, -6, 8, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#333'; ctx.lineWidth = 2; ctx.beginPath();
  ctx.moveTo(-44 + Math.cos(tr) * 8, -6 + Math.sin(tr) * 8); ctx.lineTo(-44 - Math.cos(tr) * 8, -6 - Math.sin(tr) * 8); ctx.stroke();

  ctx.fillStyle = '#d9443a';
  ctx.beginPath(); ctx.ellipse(0, 0, 22, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#9fd3ee';
  ctx.beginPath(); ctx.ellipse(10, -2, 11, 8.5, 0, -Math.PI / 2, Math.PI / 2); ctx.lineTo(4, 6); ctx.lineTo(4, -10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fillRect(-12, -6, 12, 2);

  ctx.fillStyle = '#2b2f36'; ctx.fillRect(-2, -18, 4, 6);
  ctx.fillStyle = `rgba(30,30,30,${0.08 + spin * 0.18})`;
  ctx.beginPath(); ctx.ellipse(0, -17, 42, 2.5, 0, 0, Math.PI * 2); ctx.fill();
  const L = 42 * Math.cos(h.rotor);
  ctx.strokeStyle = '#1f2227'; ctx.lineWidth = 2.5; ctx.beginPath(); ctx.moveTo(-L, -17); ctx.lineTo(L, -17); ctx.stroke();
  ctx.restore();

  const hp = hookPos(h);
  ctx.fillStyle = crate && crate.attached ? '#ffd166' : '#555';
  ctx.beginPath(); ctx.arc(hp.x, hp.y, 2.5, 0, Math.PI * 2); ctx.fill();
}

function roundRect(x, y, w, hh, r) { ctx.beginPath(); ctx.roundRect ? ctx.roundRect(x, y, w, hh, r) : ctx.rect(x, y, w, hh); }

function drawHud(s) {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const h = heli, pw = 176;
  roundRect(12, 12, pw, 150, 10); ctx.fillStyle = 'rgba(8,14,24,0.62)'; ctx.fill();
  ctx.textAlign = 'left'; ctx.font = 'bold 15px system-ui,sans-serif'; ctx.fillStyle = '#fff';
  ctx.fillText(`점수 ${score}`, 24, 34);
  ctx.font = '12px system-ui,sans-serif'; ctx.fillStyle = '#9fb0c8';
  ctx.fillText(`배달 ${delivered} · 최고 ${best}`, 24, 51);

  let mtext = '';
  if (crate && crate.dead) mtext = '다음 임무 준비 중…';
  else if (crate && crate.attached) mtext = `배달: ${pads[mission.to].name} 패드`;
  else mtext = `픽업: 화물 (${pads[mission.from].name} 근처)`;
  ctx.font = 'bold 13px system-ui,sans-serif'; ctx.fillStyle = crate && crate.attached ? '#06d6a0' : '#ffd166';
  ctx.fillText(mtext, 24, 72);

  ctx.fillStyle = '#9fb0c8'; ctx.font = '12px system-ui,sans-serif'; ctx.fillText('연료', 24, 93);
  roundRect(56, 84, 118, 11, 5); ctx.fillStyle = 'rgba(255,255,255,0.12)'; ctx.fill();
  const lowFuel = h.fuel < 25;
  if (h.fuel > 0) { roundRect(56, 84, 118 * h.fuel / 100, 11, 5); ctx.fillStyle = lowFuel ? (Math.sin(time * 8) > 0 ? '#ef476f' : '#a33') : '#118ab2'; ctx.fill(); }

  const alt = Math.max(0, Math.round(groundAt(h.x) - h.y - SKID));
  const vy = Math.round(h.vy), vx = Math.round(h.vx);
  ctx.fillStyle = '#e8eef7'; ctx.font = '12px ui-monospace,Menlo,Consolas,monospace';
  ctx.fillText(`고도  ${String(alt).padStart(4)}`, 24, 115);
  ctx.fillStyle = vy > LAND_VY ? '#ef476f' : vy > LAND_VY * 0.7 ? '#ffd166' : '#e8eef7';
  ctx.fillText(`수직  ${String(vy).padStart(4)} ${vy > 5 ? '↓' : vy < -5 ? '↑' : ' '}`, 24, 132);
  ctx.fillStyle = Math.abs(vx) > LAND_VX ? '#ffd166' : '#e8eef7';
  ctx.fillText(`수평  ${String(vx).padStart(4)}`, 24, 149);

  const tilt = Math.abs(h.a) > LAND_A;
  ctx.save(); ctx.translate(152, 133); ctx.strokeStyle = tilt ? '#ffd166' : '#8aa'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.stroke();
  ctx.rotate(h.a); ctx.beginPath(); ctx.moveTo(-10, 0); ctx.lineTo(10, 0); ctx.moveTo(0, 0); ctx.lineTo(0, -6); ctx.stroke();
  ctx.restore();

  const mw = Math.min(240, W - pw - 36), mx = W - mw - 12, my = 12, mh = 58;
  if (mw > 90) {
    roundRect(mx, my, mw, mh, 8); ctx.fillStyle = 'rgba(8,14,24,0.62)'; ctx.fill();
    const toX = x => mx + 6 + x / WORLD * (mw - 12), toY = y => my + 8 + clamp((y - 50) / 1150, 0, 1) * (mh - 16);
    ctx.fillStyle = '#5f6f45'; ctx.beginPath(); ctx.moveTo(toX(0), my + mh - 4);
    miniPath.forEach((y, i) => ctx.lineTo(toX(i * 40), toY(y)));
    ctx.lineTo(toX(WORLD), my + mh - 4); ctx.fill();
    pads.forEach((p, i) => {
      ctx.fillStyle = i === mission.to && !(crate && crate.dead) ? '#06d6a0' : p.base ? '#118ab2' : '#ccc';
      ctx.fillRect(toX(p.x) - 2, toY(p.y) - 4, 4, 4);
    });
    if (crate && !crate.dead && !crate.attached) { ctx.fillStyle = '#ffd166'; ctx.fillRect(toX(crate.x) - 2, toY(crate.y) - 5, 4, 4); }
    ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(toX(h.x), toY(h.y), 3, 0, Math.PI * 2); ctx.fill();
  }

  const wx = mw > 90 ? mx + mw / 2 : W - 60, wy = my + mh + 18;
  ctx.fillStyle = '#cfe0f0'; ctx.font = '12px system-ui,sans-serif'; ctx.textAlign = 'center';
  ctx.fillText(`바람 ${wind > 0 ? '→' : '←'} ${Math.abs(Math.round(wind))}`, wx, wy);

  if (h.alive && crate && !crate.dead) {
    const tgt = crate.attached ? { x: pads[mission.to].x, y: pads[mission.to].y - 20 } : crate;
    const sx = W / 2 + (tgt.x - cam.x) * s, sy = H / 2 + (tgt.y - cam.y) * s;
    const m = 36, mb = touchOn ? 200 : m;
    if (sx < m || sx > W - m || sy < 180 || sy > H - mb) {
      const cxs = W / 2, cys = H / 2, ang = Math.atan2(sy - cys, sx - cxs);
      const ex = clamp(sx, m, W - m), ey = clamp(sy, 180, H - mb);
      ctx.save(); ctx.translate(ex, ey); ctx.rotate(ang);
      ctx.fillStyle = crate.attached ? '#06d6a0' : '#ffd166';
      ctx.beginPath(); ctx.moveTo(16, 0); ctx.lineTo(-8, -10); ctx.lineTo(-8, 10); ctx.fill();
      ctx.restore();
      const dist = Math.round(Math.hypot(tgt.x - h.x, tgt.y - h.y) / 10);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui,sans-serif';
      ctx.fillText(`${dist}m`, clamp(ex - Math.cos(ang) * 26, 30, W - 30), clamp(ey - Math.sin(ang) * 26, 170, H - mb + 16));
    }
  }

  ctx.textAlign = 'center';
  if (h.alive && h.fuel <= 0) { ctx.fillStyle = '#ef476f'; ctx.font = 'bold 20px system-ui,sans-serif'; ctx.fillText('연료 없음!', W / 2, H * 0.3); }
  else if (h.alive && lowFuel && Math.sin(time * 6) > 0) { ctx.fillStyle = '#ef476f'; ctx.font = 'bold 16px system-ui,sans-serif'; ctx.fillText('연료 부족 — H 패드로', W / 2, H * 0.3); }
  if (h.alive && crate && !crate.dead && !crate.attached) {
    const hp = hookPos(h);
    if (Math.hypot(hp.x - crate.x, hp.y - crate.y) < 48) {
      ctx.fillStyle = '#ffd166'; ctx.font = 'bold 15px system-ui,sans-serif';
      ctx.fillText(touchOn ? '고리 버튼으로 화물 연결' : 'E 키로 화물 연결', W / 2, H * 0.3 + 26);
    }
  }
  if (mode === 'crashed') { ctx.fillStyle = '#ef476f'; ctx.font = 'bold 22px system-ui,sans-serif'; ctx.fillText(crashReason, W / 2, H * 0.36); }
}

const overlay = document.getElementById('overlay'), card = document.getElementById('card');
function showTitle() {
  card.innerHTML = `
    <h1>헬기 조종</h1>
    <p class="sub">화물을 줄에 매달아 도착지 패드에 내려놓으세요.<br>흔들리는 화물을 다루는 게 핵심입니다.</p>
    <div class="keys">
      <b>▲ / W / Space</b><span>출력 올리기 (상승)</span>
      <b>▼ / S</b><span>출력 내리기 (하강)</span>
      <b>◀ ▶ / A D</b><span>기체 기울이기 (전진·후진)</span>
      <b>E</b><span>화물 고리 걸기 / 풀기</span>
      <b>R</b><span>다시 시작</span>
    </div>
    <ul class="rules">
      <li>착륙은 천천히(수직 ${LAND_VY} 이하), 수평으로.</li>
      <li>로터나 꼬리가 지형에 닿으면 추락합니다.</li>
      <li><b style="color:#118ab2">H</b> 패드에 착륙하면 연료가 채워집니다.</li>
      <li>화물을 세게 떨어뜨리면 파손(−50). 빨리 배달할수록 보너스.</li>
    </ul>
    <button class="go" id="go">시작</button>`;
  overlay.classList.remove('hidden');
  document.getElementById('go').onclick = start;
}
function showOver() {
  card.innerHTML = `
    <h1>추락</h1>
    <p class="sub">${crashReason}</p>
    <div class="big">${score}</div>
    <p class="sub">배달 ${delivered}건 · 최고 기록 ${best}</p>
    <button class="go" id="go">다시 비행</button>`;
  overlay.classList.remove('hidden');
  document.getElementById('go').onclick = start;
}
function start() {
  reset(); mode = 'play'; overlay.classList.add('hidden');
  for (const k in keys) keys[k] = 0;
}

const KEYMAP = { ArrowUp: 'up', KeyW: 'up', Space: 'up', ArrowDown: 'down', KeyS: 'down', ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right' };
addEventListener('keydown', e => {
  const k = KEYMAP[e.code];
  if (k) { keys[k] = 1; e.preventDefault(); }
  if (e.repeat) return;
  if (mode === 'play' && e.code === 'KeyE') hookPressed = true;
  if (e.code === 'KeyR' && (mode === 'play' || mode === 'over')) start();
  else if ((mode === 'title' || mode === 'over') && (e.code === 'Enter' || e.code === 'Space')) start();
});
addEventListener('keyup', e => { const k = KEYMAP[e.code]; if (k) keys[k] = 0; });
addEventListener('blur', () => { for (const k in keys) keys[k] = 0; });

let touchOn = matchMedia('(pointer: coarse)').matches;
const touchEl = document.getElementById('touch');
if (touchOn) touchEl.classList.add('on');
addEventListener('touchstart', () => { if (!touchOn) { touchOn = true; touchEl.classList.add('on'); } }, { passive: true });
for (const b of touchEl.querySelectorAll('.btn')) {
  const k = b.dataset.k;
  const down = e => { e.preventDefault(); b.classList.add('on'); if (k === 'hook') { if (mode === 'play') hookPressed = true; } else keys[k] = 1; };
  const up = e => { e.preventDefault(); b.classList.remove('on'); if (k !== 'hook') keys[k] = 0; };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('pointerleave', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
}

let last = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (mode !== 'title') {
    acc += dt;
    while (acc >= STEP) { step(STEP); acc -= STEP; }
  } else { time += dt; heli.rotor += dt * 2; }
  render();
  requestAnimationFrame(frame);
}
reset(); showTitle();
requestAnimationFrame(frame);
</script>
</body>
</html>
